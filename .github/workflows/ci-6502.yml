name: 6502 (Commodore / Atari / Apple)

on:
  push:
    branches: ["main"]

permissions:
  contents: write

# -----------------------------------------------------------------------
# Builds the editor for three 6502-family targets using cc65.
# cc65 is available in the Ubuntu apt repository.
#
# All three targets share the conio6502.c platform layer, which uses
# cc65's <conio.h> for terminal I/O.  Target-specific key codes are
# selected at compile time via cc65's preprocessor macros
# (__C64__, __ATARI__, __APPLE2ENH__).
#
# Output names respect each platform's filesystem limits:
#   ft-c64.prg  — Commodore 64 (CBM DOS 16-char limit)
#   ft-a8.xex   — Atari 8-bit  (Atari DOS 8.3 limit)
#   ft-apple2   — Apple IIe    (ProDOS 15-char limit)
#
# Compile-only: no emulator is available in CI for 6502 hardware.
# Use VICE (C64), Atari800 (Atari), or AppleWin (Apple II) to run.
# -----------------------------------------------------------------------

jobs:
  commodore-64:
    name: Commodore 64 (cc65)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: sudo apt-get update -qq && sudo apt-get install -y cc65

      - name: Build for C64
        run: |
          cl65 -Os -t c64 \
            -Isrc \
            -o ft-c64.prg \
            src/main.c src/editor.c src/buffer.c src/platform/conio6502.c

      - name: Upload C64 binary
        uses: actions/upload-artifact@v4
        with:
          name: forever-text-c64
          path: ft-c64.prg

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: ft-c64.prg

  atari-8bit:
    name: Atari 8-bit (cc65)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: sudo apt-get update -qq && sudo apt-get install -y cc65

      - name: Build for Atari 8-bit
        run: |
          cl65 -Os -t atari \
            -Isrc \
            -o ft-a8.xex \
            src/main.c src/editor.c src/buffer.c src/platform/conio6502.c

      - name: Upload Atari 8-bit binary
        uses: actions/upload-artifact@v4
        with:
          name: forever-text-atari8
          path: ft-a8.xex

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: ft-a8.xex

  apple-ii:
    name: Apple II enhanced (cc65)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65
        run: sudo apt-get update -qq && sudo apt-get install -y cc65

      - name: Build for Apple IIe enhanced
        run: |
          cl65 -Os -t apple2enh \
            -Isrc \
            -o ft-apple2 \
            src/main.c src/editor.c src/buffer.c src/platform/conio6502.c

      - name: Upload Apple II binary
        uses: actions/upload-artifact@v4
        with:
          name: forever-text-apple2
          path: ft-apple2

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: ft-apple2
