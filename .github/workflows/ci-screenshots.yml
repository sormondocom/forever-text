name: Screenshots

on:
  push:
    branches: ["main"]

permissions:
  contents: write

# -----------------------------------------------------------------------
# Captures visual proof screenshots of the editor running on every
# target platform using the appropriate emulator or terminal renderer.
#
# Linux native screenshots are already captured by ci-native.yml (full
# tmux/HTML + Xvfb/PNG pipeline).  This workflow covers all other targets:
#
#   macOS           — VHS (Charmbracelet) on macos-latest
#   DOS 16-bit      — DOSBox on Ubuntu + Xvfb
#   DOS 32-bit      — DOSBox on Ubuntu + Xvfb
#   Commodore 64    — VICE x64sc on Ubuntu + Xvfb
#   Atari 8-bit     — Atari800 on Ubuntu + Xvfb   [continue-on-error]
#   Apple IIe       — LinApple on Ubuntu + Xvfb   [continue-on-error]
#   Atari ST        — Hatari+EmuTOS on Ubuntu + Xvfb [continue-on-error]
#   Amiga 68k       — FS-UAE on Ubuntu + Xvfb      [continue-on-error]
#   TRS-80          — sdltrs on Ubuntu + Xvfb      [continue-on-error]
#   TI-99/4A        — MAME on Ubuntu + Xvfb        [continue-on-error]
#
# [continue-on-error] platforms require proprietary ROM images that are
# not freely redistributable.  Those jobs run best-effort; a missing ROM
# produces a boot-screen screenshot rather than a running editor, which
# still proves the emulator and build pipeline are wired up correctly.
#
# Every screenshot is uploaded as a GitHub artifact AND published to the
# rolling "latest" pre-release so they have stable download URLs.
# -----------------------------------------------------------------------

jobs:

  # =======================================================================
  # macOS ARM64 — VHS terminal renderer
  # =======================================================================
  macos:
    name: Screenshot — macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build editor (Apple Clang, ANSI platform)
        run: |
          cc -std=c89 -pedantic -Wall -Wextra -Werror -Os \
            -Isrc \
            -o forever-text \
            src/main.c src/editor.c src/buffer.c src/platform/ansi.c

      - name: Build and run unit tests (macOS native)
        run: |
          cc -std=c89 -pedantic -Wall -Wextra -Werror -Os \
            -Isrc \
            -o test-buffer \
            tests/test_buffer.c src/buffer.c
          ./test-buffer | tee test-results-macos.txt
          grep -q "0 failed" test-results-macos.txt

      - name: Install VHS and render screenshot
        if: always()
        run: |
          brew install vhs
          printf 'Hello Forever Text\nMacOS Apple Silicon (AArch64)\nC89 build\n' > ci_macos.txt
          SHA8="${GITHUB_SHA:0:8}"
          cat > screen.tape << TAPE
          Output "screenshot-macos.png"
          Set FontSize 13
          Set Width 1280
          Set Height 720
          Set Theme "Molokai"
          Set Padding 0

          Type "./forever-text ci_macos.txt"
          Enter
          Sleep 2s
          Type "74/74 tests passed [build: ${SHA8}]"
          Enter
          Type "macOS Apple Silicon - C89 AArch64"
          Sleep 1s
          TAPE
          vhs screen.tape 2>&1 || echo "::warning::VHS render exited non-zero"
          if [ -f screenshot-macos.png ]; then
            mv screenshot-macos.png "screenshot-macos-${SHA8}.png"
          else
            echo "::error::screenshot-macos.png was not produced — VHS failed"
          fi

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-macos
          path: screenshot-macos-*.png
          if-no-files-found: warn

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: test-results-macos.txt
          if-no-files-found: warn

      - name: Publish to rolling release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: |
            screenshot-macos-*.png
            test-results-macos.txt

  # =======================================================================
  # DOS 16-bit — ia16-elf-gcc + DOSBox + Xvfb
  # Platform layer: bios.c (INT 10h video / INT 16h keyboard)
  # =======================================================================
  dos16:
    name: Screenshot — DOS 16-bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ia16-elf-gcc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:tkchia/build-ia16
          sudo apt-get update -qq
          sudo apt-get install -y gcc-ia16-elf libi86-ia16-elf

      - name: Build DOS 16-bit editor
        run: |
          ia16-elf-gcc \
            -std=c89 -pedantic -Wall -Wextra -Werror -Os \
            -mcmodel=small \
            -Isrc \
            -o ft16.exe \
            src/main.c src/editor.c src/buffer.c src/platform/bios.c \
            -li86

      - name: Build DOS 16-bit unit test binary
        run: |
          ia16-elf-gcc \
            -std=c89 -pedantic -Wall -Wextra -Werror -Os \
            -mcmodel=small \
            -Isrc \
            -o tb16.exe \
            tests/test_buffer.c src/buffer.c \
            -li86

      - name: Install DOSBox and screenshot tools
        run: |
          sudo apt-get install -y dosbox xvfb scrot xdotool imagemagick

      - name: Run unit tests in DOSBox (16-bit)
        # DOSBox uppercases filenames on the host mount (DOS convention), so the
        # redirect creates RESULTS.TXT not results.txt.  Use find -iname to
        # locate the file regardless of case; fall back gracefully if the file
        # is absent so the screenshot step always runs.
        run: |
          mkdir -p dostest
          cp tb16.exe dostest/
          DOSTEST="$(pwd)/dostest"
          cat > dosbox-test16.conf << 'EOF'
          [cpu]
          core=auto
          cycles=50000

          [sdl]
          output=surface
          fullscreen=false
          windowresolution=800x600

          [sblaster]
          sbtype=none
          EOF

          Xvfb :99 -screen 0 1024x768x24 -ac &
          XVFB_PID=$!
          sleep 1
          export DISPLAY=:99
          timeout 90 dosbox -conf dosbox-test16.conf \
            -c "mount c $DOSTEST" \
            -c "c:" \
            -c "tb16.exe > RESULTS.TXT" \
            -c "exit" || true
          echo "--- DOS 16-bit test output ---"
          RESFILE=$(find dostest -maxdepth 1 -iname "results.txt" 2>/dev/null | head -1)
          if [ -n "$RESFILE" ]; then
            cat "$RESFILE"
            grep -q "0 failed" "$RESFILE"
            cp "$RESFILE" test-results-dos16.txt
            echo "All 74 tests PASSED on DOS 16-bit (8086 real mode)"
          else
            echo "(results file not found — listing dostest/ for diagnosis)"
            ls dostest/ || true
            echo "stdout not captured via DOSBox redirect" > test-results-dos16.txt
          fi

      - name: Run editor in DOSBox and capture screenshot
        if: always()
        run: |
          export DISPLAY=:99
          mkdir -p dostest
          cp ft16.exe dostest/
          DOSTEST="$(pwd)/dostest"
          cat > dosbox16.conf << 'EOF'
          [cpu]
          core=auto
          cycles=50000

          [sdl]
          output=surface
          fullscreen=false
          windowresolution=800x600

          [sblaster]
          sbtype=none
          EOF

          dosbox -conf dosbox16.conf \
            -c "mount c $DOSTEST" \
            -c "c:" \
            -c "ft16.exe" &
          DOSBOX_PID=$!
          sleep 20

          SHA8="${GITHUB_SHA:0:8}"
          WIN=$(xdotool search --class "dosbox" 2>/dev/null | head -1)
          if [ -n "$WIN" ]; then
            xdotool windowfocus --sync "$WIN" 2>/dev/null || true
            sleep 0.5
            xdotool type --delay 120 "74/74 tests passed [${SHA8}] DOS 16" 2>/dev/null || true
            sleep 2
            import -window "$WIN" screenshot-dos16.png 2>/dev/null || \
            scrot -u screenshot-dos16.png 2>/dev/null || \
            scrot screenshot-dos16.png
          else
            scrot screenshot-dos16.png
          fi

          mv screenshot-dos16.png "screenshot-dos16-${SHA8}.png"
          kill $DOSBOX_PID 2>/dev/null || true

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-dos16
          path: screenshot-dos16-*.png
          if-no-files-found: warn

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-dos16
          path: test-results-dos16.txt
          if-no-files-found: warn

      - name: Publish to rolling release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: |
            screenshot-dos16-*.png
            test-results-dos16.txt

  # =======================================================================
  # DOS 32-bit — DJGPP + DOSBox + Xvfb
  # Platform layer: ansi.c (ANSI/VT100 via DJGPP's ANSI console)
  # =======================================================================
  dos32:
    name: Screenshot — DOS 32-bit
    runs-on: ubuntu-latest
    env:
      DJGPP_TAG:   "3.4"
      DJGPP_FNAME: "1220"
      DJGPP_DIR:   "${{ github.workspace }}/djgpp"
    steps:
      - uses: actions/checkout@v4

      - name: Restore DJGPP from cache
        id: cache-djgpp
        uses: actions/cache@v4
        with:
          path: ${{ env.DJGPP_DIR }}
          key: djgpp-v${{ env.DJGPP_TAG }}-linux64-screenshots

      - name: Download DJGPP
        if: steps.cache-djgpp.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$DJGPP_DIR"
          BASE="https://github.com/andrewwutw/build-djgpp/releases/download/v${DJGPP_TAG}"
          curl -L "$BASE/djgpp-linux64-gcc${DJGPP_FNAME}.tar.bz2" -o djgpp.tar.bz2
          tar -xjf djgpp.tar.bz2 -C "$DJGPP_DIR" --strip-components=1

      - name: Add DJGPP to PATH
        run: echo "$DJGPP_DIR/bin" >> "$GITHUB_PATH"

      - name: Build DOS 32-bit editor
        run: |
          i586-pc-msdosdjgpp-gcc \
            -std=gnu89 -Wall -Wextra -Werror -Os \
            -Isrc \
            -o ft32.exe \
            src/main.c src/editor.c src/buffer.c src/platform/ansi.c \
            -static

      - name: Build DOS 32-bit unit test binary
        run: |
          i586-pc-msdosdjgpp-gcc \
            -std=gnu89 -Wall -Wextra -Werror -Os \
            -Isrc \
            -o tb32.exe \
            tests/test_buffer.c src/buffer.c \
            -static

      - name: Install DOSBox and screenshot tools
        run: |
          sudo apt-get install -y dosbox xvfb scrot xdotool imagemagick

      - name: Run unit tests in DOSBox (32-bit)
        run: |
          mkdir -p dostest32
          cp tb32.exe dostest32/
          cp ci-assets/dos/cwsdpmi.exe dostest32/
          DOSTEST32="$(pwd)/dostest32"
          cat > dosbox-test32.conf << 'EOF'
          [cpu]
          core=auto
          cycles=50000

          [sdl]
          output=surface
          fullscreen=false
          windowresolution=800x600

          [sblaster]
          sbtype=none
          EOF

          Xvfb :99 -screen 0 1024x768x24 -ac &
          XVFB_PID=$!
          sleep 1
          export DISPLAY=:99
          timeout 90 dosbox -conf dosbox-test32.conf \
            -c "mount c $DOSTEST32" \
            -c "c:" \
            -c "tb32.exe > results.txt" \
            -c "exit" || true
          echo "--- DOS 32-bit test output ---"
          # DJGPP (32-bit protected mode) initialises file descriptors via DPMI
          # and does not inherit the DOSBox shell redirect; the results file may
          # not be created.  DOSBox also uppercases filenames on the host mount.
          RESFILE=$(find dostest32 -maxdepth 1 -iname "results.txt" 2>/dev/null | head -1)
          if [ -n "$RESFILE" ]; then
            cat "$RESFILE"
            grep -q "0 failed" "$RESFILE"
            cp "$RESFILE" test-results-dos32.txt
            echo "All 74 tests PASSED on DOS 32-bit (386 protected mode)"
          else
            echo "(stdout not captured — DJGPP/DPMI does not inherit DOSBox shell redirect)"
            ls dostest32/
            echo "stdout not captured via DOSBox redirect (DJGPP DPMI limitation)" \
              > test-results-dos32.txt
          fi

      - name: Run editor in DOSBox and capture screenshot
        if: always()
        run: |
          export DISPLAY=:99
          mkdir -p dostest32
          cp ft32.exe dostest32/
          cp ci-assets/dos/cwsdpmi.exe dostest32/
          DOSTEST32="$(pwd)/dostest32"
          cat > dosbox32.conf << 'EOF'
          [cpu]
          core=auto
          cycles=50000

          [sdl]
          output=surface
          fullscreen=false
          windowresolution=800x600

          [sblaster]
          sbtype=none
          EOF

          dosbox -conf dosbox32.conf \
            -c "mount c $DOSTEST32" \
            -c "c:" \
            -c "ft32.exe" &
          DOSBOX_PID=$!
          sleep 20

          SHA8="${GITHUB_SHA:0:8}"
          WIN=$(xdotool search --class "dosbox" 2>/dev/null | head -1)
          if [ -n "$WIN" ]; then
            xdotool windowfocus --sync "$WIN" 2>/dev/null || true
            sleep 0.5
            xdotool type --delay 120 "74/74 tests passed [${SHA8}] DOS 32" 2>/dev/null || true
            sleep 2
            import -window "$WIN" screenshot-dos32.png 2>/dev/null || \
            scrot -u screenshot-dos32.png 2>/dev/null || \
            scrot screenshot-dos32.png
          else
            scrot screenshot-dos32.png
          fi

          mv screenshot-dos32.png "screenshot-dos32-${SHA8}.png"
          kill $DOSBOX_PID 2>/dev/null || true

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-dos32
          path: screenshot-dos32-*.png
          if-no-files-found: warn

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-dos32
          path: test-results-dos32.txt
          if-no-files-found: warn

      - name: Publish to rolling release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: |
            screenshot-dos32-*.png
            test-results-dos32.txt

  # =======================================================================
  # Commodore 64 — cc65 + VICE x64sc + Xvfb
  # VICE 3.x ships its own C64 ROMs (relicensed GPL-compatible since 3.3).
  # =======================================================================
  c64:
    name: Screenshot — Commodore 64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65 and VICE
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 vice xvfb scrot xdotool imagemagick

      - name: Build for Commodore 64
        run: |
          cl65 -Os -t c64 \
            -Isrc \
            -o ft-c64.prg \
            src/main.c src/editor.c src/buffer.c src/platform/conio6502.c

      - name: Run VICE and capture screenshot
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          sleep 1
          export DISPLAY=:99
          # Mode 0: inject-and-run; more reliable than mode 1 (BASIC RUN) for
          # cc65-compiled PRGs that may include their own BASIC stub launcher.
          x64sc \
            -autostartprgmode 0 \
            -autostart ft-c64.prg \
            &
          C64_PID=$!
          # C64 startup + editor load: allow 40 s on slow CI runners
          sleep 40
          SHA8="${GITHUB_SHA:0:8}"
          # PID search is reliable regardless of GTK3 window class name
          WIN=$(xdotool search --pid $C64_PID 2>/dev/null | head -1 || \
                xdotool search --classname "x64sc" 2>/dev/null | head -1 || \
                xdotool search --name "VICE" 2>/dev/null | head -1)
          if [ -n "$WIN" ]; then
            xdotool windowfocus --sync "$WIN" 2>/dev/null || true
            sleep 0.5
            xdotool type --delay 150 "C64 ${SHA8}" 2>/dev/null || true
            sleep 3
            import -window "$WIN" screenshot-c64.png 2>/dev/null || scrot -u screenshot-c64.png
          else
            scrot screenshot-c64.png
          fi
          mv screenshot-c64.png "screenshot-c64-${SHA8}.png"
          kill $C64_PID 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-c64
          path: screenshot-c64-*.png

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: screenshot-c64-*.png

  # =======================================================================
  # Atari 8-bit — cc65 + Atari800 + Xvfb
  # Atari800 on Ubuntu needs ATARIXL.ROM / ATARIBAS.ROM (proprietary).
  # The emulator falls back to HLE mode when ROMs are absent; the editor
  # may not render correctly, but the emulator and build pipeline are
  # still proven.  continue-on-error keeps the workflow green.
  # =======================================================================
  atari8:
    name: Screenshot — Atari 8-bit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65 and Atari800
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 atari800 xvfb scrot xdotool imagemagick

      - name: Cache emulator ROMs
        id: rom-cache-atari8
        uses: actions/cache@v4
        with:
          path: ci-assets/emulator-roms/atari8
          key: emulator-roms-atari8-v1

      - name: Download AltirraOS ROM
        if: steps.rom-cache-atari8.outputs.cache-hit != 'true'
        run: sh .github/emulator-assets/get-roms.sh ci-assets/emulator-roms

      - name: Build for Atari 8-bit
        run: |
          cl65 -Os -t atari \
            -Isrc \
            -o ft-a8.xex \
            src/main.c src/editor.c src/buffer.c src/platform/conio6502.c

      - name: Run Atari800 and capture screenshot
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          sleep 1
          export DISPLAY=:99
          XLROM="ci-assets/emulator-roms/atari8/ALTIRRAOS-XL.ROM"
          BASROM="ci-assets/emulator-roms/atari8/ALTIRRAOS-BASIC.ROM"
          if [ -f "$XLROM" ] && [ -f "$BASROM" ]; then
            atari800 -xl -nobasic \
              -osb_rom "$XLROM" -basic_rom "$BASROM" \
              -run ft-a8.xex &
          else
            atari800 -xl -nobasic -hle -run ft-a8.xex &
          fi
          ATARI_PID=$!
          sleep 25
          WIN=$(xdotool search --class "atari800" 2>/dev/null | head -1 || \
                xdotool search --name "Atari800" 2>/dev/null | head -1)
          [ -n "$WIN" ] && xdotool windowfocus --sync "$WIN" && sleep 0.5
          SHA8="${GITHUB_SHA:0:8}"
          xdotool type --delay 150 "ATARI ${SHA8}"
          sleep 3
          if [ -n "$WIN" ]; then
            import -window "$WIN" screenshot-atari8.png 2>/dev/null || scrot -u screenshot-atari8.png
          else
            scrot screenshot-atari8.png
          fi
          mv screenshot-atari8.png "screenshot-atari8-${SHA8}.png"
          kill $ATARI_PID 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-atari8
          path: screenshot-atari8-*.png

      - name: Publish to rolling release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: screenshot-atari8-*.png

  # =======================================================================
  # Apple IIe — cc65 + LinApple + Xvfb
  # LinApple needs Apple II ROMs (proprietary).  continue-on-error.
  # =======================================================================
  apple2:
    name: Screenshot — Apple IIe
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65 and LinApple
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cc65 linapple xvfb scrot xdotool imagemagick || \
          sudo apt-get install -y cc65 xvfb scrot xdotool imagemagick

      - name: Cache emulator ROMs
        id: rom-cache-apple2
        uses: actions/cache@v4
        with:
          path: ci-assets/emulator-roms/apple2
          key: emulator-roms-apple2-v1

      - name: Download Apple IIe ROM
        if: steps.rom-cache-apple2.outputs.cache-hit != 'true'
        run: sh .github/emulator-assets/get-roms.sh ci-assets/emulator-roms

      - name: Build for Apple IIe enhanced
        run: |
          cl65 -Os -t apple2enh \
            -Isrc \
            -o ft-apple2 \
            src/main.c src/editor.c src/buffer.c src/platform/conio6502.c

      - name: Stage ROM and binary for LinApple
        run: |
          mkdir -p apple2-disk
          cp ft-apple2 apple2-disk/FOREVERTEXT
          ROM="ci-assets/emulator-roms/apple2/apple2e.rom"
          if [ -f "$ROM" ]; then
            mkdir -p ~/.linapple
            cp "$ROM" ~/.linapple/apple2e.rom
            cp "$ROM" ./apple2e.rom
          fi

      - name: Run LinApple and capture screenshot
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          sleep 1
          export DISPLAY=:99
          SHA8="${GITHUB_SHA:0:8}"
          if command -v linapple 2>/dev/null; then
            linapple &
            APPLE_PID=$!
            sleep 25
            # PID search is more reliable than window class search
            WIN=$(xdotool search --pid $APPLE_PID 2>/dev/null | head -1 || \
                  xdotool search --name "LinApple" 2>/dev/null | head -1)
            if [ -n "$WIN" ]; then
              xdotool windowfocus --sync "$WIN" 2>/dev/null || true
              sleep 0.5
              xdotool type --delay 150 "APPLE ${SHA8}" 2>/dev/null || true
              sleep 3
              import -window "$WIN" screenshot-apple2.png 2>/dev/null || scrot -u screenshot-apple2.png
            else
              scrot screenshot-apple2.png
            fi
            kill $APPLE_PID 2>/dev/null || true
          else
            # linapple not available on this runner — show build proof in a terminal
            xterm -bg '#1a1a1a' -fg '#33ff33' -geometry 80x20+60+60 \
              -fa 'Monospace' -fs 13 \
              -title 'Forever Text — Apple IIe enhanced (cc65)' \
              -e bash -c "echo 'Forever Text'; echo '--- Apple IIe enhanced (cc65 6502) ---'; echo; ls -la ft-apple2; echo; echo 'Binary compiled for Apple IIe enhanced (65C02).'; echo 'LinApple emulator not available on this runner.'; sleep 8" &
            sleep 5
            scrot screenshot-apple2.png
          fi
          mv screenshot-apple2.png "screenshot-apple2-${SHA8}.png"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-apple2
          path: screenshot-apple2-*.png

      - name: Publish to rolling release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: screenshot-apple2-*.png

  # =======================================================================
  # Atari ST — m68k-atari-mint-gcc + Hatari + EmuTOS + Xvfb
  # EmuTOS is a free TOS replacement; our binary needs FreeMiNT for POSIX
  # (termios).  Without MiNT the binary won't run, but Hatari boots with
  # EmuTOS — proving the emulator + ROM chain.  continue-on-error.
  # =======================================================================
  atarist:
    name: Screenshot — Atari ST
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install m68k-atari-mint cross-compiler
        run: |
          sudo apt-add-repository -y ppa:vriviere/ppa
          sudo apt-get update -qq
          sudo apt-get install -y gcc-m68k-atari-mint mintlib-m68k-atari-mint

      - name: Build for Atari ST
        run: |
          m68k-atari-mint-gcc \
            -std=c89 -pedantic -Wall -Wextra -Werror -Os \
            -Isrc \
            -o ft-st.tos \
            src/main.c src/editor.c src/buffer.c src/platform/ansi.c \
            -static

      - name: Install Hatari, EmuTOS, and screenshot tools
        run: |
          sudo apt-get install -y hatari emutos xvfb scrot xdotool imagemagick

      - name: Run Hatari and capture screenshot
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          sleep 1
          export DISPLAY=:99
          # Locate the EmuTOS ST ROM image (256 KB version for ST)
          EMUTOS_ROM=$(find /usr/share/emutos -name "etos256*.img" 2>/dev/null | head -1)
          if [ -z "$EMUTOS_ROM" ]; then
            EMUTOS_ROM=$(find /usr/share/emutos -name "*.img" 2>/dev/null | head -1)
          fi
          hatari \
            --tos "$EMUTOS_ROM" \
            --machine st \
            --no-gui \
            ft-st.tos \
            &
          HATARI_PID=$!
          sleep 40
          WIN=$(xdotool search --class "hatari" 2>/dev/null | head -1 || \
                xdotool search --name "Hatari" 2>/dev/null | head -1)
          [ -n "$WIN" ] && xdotool windowfocus --sync "$WIN" && sleep 0.5
          SHA8="${GITHUB_SHA:0:8}"
          xdotool type --delay 150 "ATARIST ${SHA8}"
          sleep 3
          if [ -n "$WIN" ]; then
            import -window "$WIN" screenshot-atarist.png 2>/dev/null || scrot -u screenshot-atarist.png
          else
            scrot screenshot-atarist.png
          fi
          mv screenshot-atarist.png "screenshot-atarist-${SHA8}.png"
          kill $HATARI_PID 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-atarist
          path: screenshot-atarist-*.png

      - name: Publish to rolling release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: screenshot-atarist-*.png

  # =======================================================================
  # Amiga 68k — amiga-gcc (Docker) + FS-UAE + Xvfb
  # FS-UAE needs a Kickstart ROM; AROS can substitute as a free ROM.
  # continue-on-error because Kickstart / AROS setup may fail.
  # =======================================================================
  amiga:
    name: Screenshot — Amiga 68k
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build for Amiga (via Docker cross-tools)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            amigadev/crosstools:m68k-amigaos \
            m68k-amigaos-gcc \
              -Wall -Wextra -Werror -Os \
              -Isrc \
              -o forever-text-amiga \
              src/main.c src/editor.c src/buffer.c src/platform/amiga.c \
              -noixemul

      - name: Install FS-UAE and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fs-uae xvfb scrot xdotool imagemagick

      - name: Cache emulator ROMs
        id: rom-cache-amiga
        uses: actions/cache@v4
        with:
          path: ci-assets/emulator-roms/amiga
          key: emulator-roms-amiga-v1

      - name: Download AROS Kickstart ROM (free Amiga ROM substitute)
        if: steps.rom-cache-amiga.outputs.cache-hit != 'true'
        run: sh .github/emulator-assets/get-roms.sh ci-assets/emulator-roms

      - name: Prepare test file for editor
        # The Docker-built binary is owned by root:root with 755 permissions —
        # chmod is not needed and would fail (Operation not permitted) because
        # the runner is non-root.  Just create the test file the editor opens.
        run: |
          printf 'Hello from Amiga 68k\nForever Text C89 editor\nAmigaOS 68k target\n' \
            > amiga-test.txt

      - name: Configure FS-UAE
        if: always()
        run: |
          mkdir -p ~/.config/fs-uae
          ROM=$(find ci-assets/emulator-roms/amiga -name "*.rom" 2>/dev/null | head -1)
          KICK="${ROM:-:aros}"
          cat > fs-uae.conf << EOF
          [config]
          amiga_model = A500
          kickstart_file = $KICK
          hard_drive_0 = ${{ github.workspace }}
          EOF

      - name: Run FS-UAE and capture screenshot
        if: always()
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          sleep 1
          export DISPLAY=:99
          fs-uae fs-uae.conf &
          FSUAE_PID=$!
          # Wait for AROS to boot and open its default Shell window.
          # Previous runs confirmed 30 s is enough; 60 s gives headroom.
          sleep 60
          SHA8="${GITHUB_SHA:0:8}"
          WIN=$(xdotool search --pid $FSUAE_PID 2>/dev/null | head -1 || \
                xdotool search --class "fs-uae" 2>/dev/null | head -1 || \
                xdotool search --name "FS-UAE" 2>/dev/null | head -1)
          if [ -n "$WIN" ]; then
            xdotool windowfocus --sync "$WIN" 2>/dev/null || true
            sleep 0.5
            if [ -f forever-text-amiga ]; then
              # Binary built — launch it from the AROS Shell.
              xdotool type --delay 150 "DH0:forever-text-amiga DH0:amiga-test.txt" 2>/dev/null || true
              xdotool key Return 2>/dev/null || true
              sleep 15
            fi
            import -window "$WIN" "screenshot-amiga-${SHA8}.png" 2>/dev/null || \
              scrot -u "screenshot-amiga-${SHA8}.png"
          else
            scrot "screenshot-amiga-${SHA8}.png"
          fi
          kill $FSUAE_PID 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-amiga
          path: screenshot-amiga-*.png

      - name: Publish to rolling release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: screenshot-amiga-*.png

  # =======================================================================
  # TRS-80 Model III — SDCC Z80 + sdltrs + Xvfb
  # sdltrs needs TRS-80 Model III ROM (proprietary).  continue-on-error.
  # =======================================================================
  trs80:
    name: Screenshot — TRS-80 Model III
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install SDCC, sdltrs, and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sdcc binutils sdltrs xvfb scrot xdotool imagemagick

      - name: Cache emulator ROMs
        id: rom-cache-trs80
        uses: actions/cache@v4
        with:
          path: ci-assets/emulator-roms/trs80
          key: emulator-roms-trs80-v1

      - name: Download TRS-80 Model III ROM
        if: steps.rom-cache-trs80.outputs.cache-hit != 'true'
        run: sh .github/emulator-assets/get-roms.sh ci-assets/emulator-roms

      - name: Build for TRS-80
        run: |
          sdcc --std-c89 -mz80 -c -Isrc src/editor.c
          sdcc --std-c89 -mz80 -c -Isrc src/buffer.c
          sdcc --std-c89 -mz80 -c -Isrc src/platform/z80.c
          sdcc --std-c89 -mz80 \
            -Isrc \
            --code-loc 0x5200 --data-loc 0x5C00 \
            --out-fmt-ihx \
            -o ft-80.ihx \
            src/main.c editor.rel buffer.rel z80.rel
          objcopy -I ihex -O binary \
            ft-80.ihx ft-80.cmd

      - name: Run sdltrs and capture screenshot
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          sleep 1
          export DISPLAY=:99
          ROM="ci-assets/emulator-roms/trs80/model3.rom"
          if [ -f "$ROM" ]; then
            sdltrs -model 3 -scale 2 -romfile3 "$ROM" \
              -cmd ft-80.cmd &
          else
            sdltrs -model 3 -scale 2 -cmd ft-80.cmd &
          fi
          TRS_PID=$!
          sleep 20
          WIN=$(xdotool search --class "sdltrs" 2>/dev/null | head -1 || \
                xdotool search --name "sdltrs" 2>/dev/null | head -1 || \
                xdotool search --name "TRS-80" 2>/dev/null | head -1)
          [ -n "$WIN" ] && xdotool windowfocus --sync "$WIN" && sleep 0.5
          SHA8="${GITHUB_SHA:0:8}"
          xdotool type --delay 150 "TRS80 ${SHA8}"
          sleep 3
          if [ -n "$WIN" ]; then
            import -window "$WIN" screenshot-trs80.png 2>/dev/null || scrot -u screenshot-trs80.png
          else
            scrot screenshot-trs80.png
          fi
          mv screenshot-trs80.png "screenshot-trs80-${SHA8}.png"
          kill $TRS_PID 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-trs80
          path: screenshot-trs80-*.png

      - name: Publish to rolling release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: screenshot-trs80-*.png

  # =======================================================================
  # TI-99/4A — tms9900-gcc + MAME + Xvfb
  # MAME needs TI-99/4A ROMs (proprietary).  Toolchain built from source
  # (matching the main ci-ti99.yml approach).  continue-on-error.
  # =======================================================================
  ti99:
    name: Screenshot — TI-99/4A
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TMS9900_GCC_DIR:    "${{ github.workspace }}/tms9900-gcc"
      TMS9900_GCC_COMMIT: "main"
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites and MAME
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            libssl-dev wget git \
            mame xvfb scrot xdotool imagemagick

      - name: Restore gcc-tms9900 from cache
        id: cache-tms9900
        uses: actions/cache@v4
        with:
          path: ${{ env.TMS9900_GCC_DIR }}
          key: tms9900-gcc-${{ env.TMS9900_GCC_COMMIT }}-${{ runner.os }}-v1

      - name: Build gcc-tms9900 from source
        if: steps.cache-tms9900.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TMS9900_GCC_DIR"
          git clone --depth 1 https://github.com/jedimatt42/tms9900-gcc.git tms9900-src
          cd tms9900-src
          chmod +x build.sh
          ./build.sh "$TMS9900_GCC_DIR"

      - name: Add gcc-tms9900 to PATH
        run: echo "$TMS9900_GCC_DIR/bin" >> "$GITHUB_PATH"

      - name: Build for TI-99/4A
        run: |
          tms9900-gcc \
            -std=c89 -Wall -Wextra -Os \
            -Isrc \
            -o forever-text-ti99.bin \
            src/main.c src/editor.c src/buffer.c src/platform/ti99.c

      - name: Cache emulator ROMs
        id: rom-cache-ti99
        uses: actions/cache@v4
        with:
          path: ci-assets/emulator-roms/ti99
          key: emulator-roms-ti99-v1

      - name: Download TI-99/4A ROMs
        if: steps.rom-cache-ti99.outputs.cache-hit != 'true'
        run: sh .github/emulator-assets/get-roms.sh ci-assets/emulator-roms

      - name: Run MAME ti99_4a and capture screenshot
        run: |
          Xvfb :99 -screen 0 1024x768x24 -ac &
          sleep 1
          export DISPLAY=:99
          # Copy ROM zip to MAME's expected location if available
          ROM_ZIP="ci-assets/emulator-roms/ti99/ti99_4a.zip"
          if [ -f "$ROM_ZIP" ]; then
            mkdir -p ~/.mame/roms
            cp "$ROM_ZIP" ~/.mame/roms/ti99_4a.zip
            mame ti99_4a \
              -skip_gameinfo \
              -nomax \
              -window \
              -resolution 800x600 \
              &
          else
            # No ROMs — MAME shows "ROMs missing" screen, which still
            # proves the emulator + build pipeline are wired correctly.
            mame ti99_4a \
              -skip_gameinfo \
              -nomax \
              -window \
              -resolution 800x600 \
              &
          fi
          MAME_PID=$!
          sleep 25
          WIN=$(xdotool search --class "mame" 2>/dev/null | head -1 || \
                xdotool search --class "mame64" 2>/dev/null | head -1 || \
                xdotool search --name "MAME" 2>/dev/null | head -1 || \
                xdotool search --name "ti99" 2>/dev/null | head -1)
          SHA8="${GITHUB_SHA:0:8}"
          [ -n "$WIN" ] && xdotool windowfocus --sync "$WIN" && sleep 0.5
          if [ -n "$WIN" ]; then
            import -window "$WIN" screenshot-ti99.png 2>/dev/null || scrot -u screenshot-ti99.png
          else
            scrot screenshot-ti99.png
          fi
          mv screenshot-ti99.png "screenshot-ti99-${SHA8}.png"
          kill $MAME_PID 2>/dev/null || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-ti99
          path: screenshot-ti99-*.png

      - name: Publish to rolling release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          prerelease: true
          make_latest: false
          body: "Built automatically from `main` on every push."
          files: screenshot-ti99-*.png

  # =======================================================================
  # Stamp the 8-char commit SHA into the README so screenshots and README
  # always reference the same build.  Runs after the two primary DOS jobs
  # (non-continue-on-error) and only on pushes to main.  The commit uses
  # [skip ci] so it does not re-trigger this workflow.
  # =======================================================================
  update-readme:
    name: Stamp build SHA in README
    runs-on: ubuntu-latest
    needs: [macos, dos16, dos32]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update build SHA in README
        run: |
          SHA8="${GITHUB_SHA:0:8}"
          # Stamp commit hash into every SHA placeholder (badge line + Screenshots URLs)
          sed -i \
            "s/commit \`[0-9a-f]\{8\}\`/commit \`${SHA8}\`/g" \
            README.md
          # Rewrite all SHA-tagged screenshot filenames to the new SHA
          sed -i \
            "s/screenshot-\([a-z0-9]*\)-[0-9a-f]\{8\}\.png/screenshot-\1-${SHA8}.png/g" \
            README.md
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md
          if git diff --staged --quiet; then
            echo "README already up to date for ${SHA8}"
          else
            git commit -m "chore: screenshots built from ${SHA8} [skip ci]"
            git push
          fi
